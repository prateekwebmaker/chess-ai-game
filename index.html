<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chess AI Game</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>♟️ Chess vs AI ♟️</h1>
            <div class="game-info">
                <div class="player-info">
                    <span class="player-name">You (White)</span>
                    <span class="player-status" id="whiteStatus">Your Turn</span>
                </div>
                <div class="vs">VS</div>
                <div class="player-info">
                    <span class="player-name">AI (Black)</span>
                    <span class="player-status" id="blackStatus">Waiting...</span>
                </div>
            </div>
        </div>

        <div class="main-content">
            <div class="board-container">
                <div class="board" id="board"></div>
            </div>

            <div class="sidebar">
                <div class="move-history">
                    <h3>Move History</h3>
                    <div class="moves-list" id="movesList"></div>
                </div>

                <div class="game-stats">
                    <h3>Game Status</h3>
                    <p id="gameStatus">Game Started - Your Move!</p>
                    <div class="captured-pieces">
                        <h4>Captured Pieces</h4>
                        <div class="white-captured">
                            <span>White Captured:</span>
                            <span id="whiteCaptured"></span>
                        </div>
                        <div class="black-captured">
                            <span>Black Captured:</span>
                            <span id="blackCaptured"></span>
                        </div>
                    </div>
                </div>

                <div class="controls">
                    <button id="resetBtn" class="btn btn-primary">New Game</button>
                    <button id="undoBtn" class="btn btn-secondary">Undo Move</button>
                    <button id="hintBtn" class="btn btn-secondary">Get Hint</button>
                </div>

                <div class="difficulty">
                    <h3>AI Difficulty</h3>
                    <div class="difficulty-buttons">
                        <button class="difficulty-btn active" data-level="1">Easy</button>
                        <button class="difficulty-btn" data-level="3">Medium</button>
                        <button class="difficulty-btn" data-level="4">Hard</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="chess.js"></script>
    <script src="ai.js"></script>
    <script src="app.js"></script>
</body>
</html>
